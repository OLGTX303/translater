# Translater app's Malay→English service. Lives in aaPanel's vhost folder on the N100
# (/www/server/panel/vhost/nginx/), next to the other olgtx.com sites, and follows their pattern:
# Cloudflare terminates HTTPS and forwards here on port 80. The container only listens on 127.0.0.1:8700.
# Rate limit per real client (Cloudflare's CF-Connecting-IP), on top of the app's bearer token.
limit_req_zone $http_cf_connecting_ip zone=translate:1m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name translate.olgtx.com;

    client_max_body_size 16k;

    location ^~ / {
        limit_req zone=translate burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8700;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    access_log /www/wwwlogs/translate.olgtx.com.log;
    error_log /www/wwwlogs/translate.olgtx.com.error.log;
}
